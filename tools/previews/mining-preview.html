<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>挖掘效果预览</title>
<style>body{margin:0;background:#bacddb;font:14px system-ui;color:#263340}canvas{display:block}aside{position:fixed;top:16px;left:16px;background:#fffE;padding:14px 18px;border-radius:12px}input{width:180px}small{display:block;margin-top:8px}</style>
<aside><b>木屑 / 石屑 · 挖掘效果预览</b><p>裂缝进度 <input id="progress" type="range" min="0" max="1" step=".01" value=".65"></p><button id="burst">预览破碎</button><small>左侧木板，右侧岩石；使用游戏中的同一套特效。</small></aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="../../src/client/world/mining-fx.js"></script>
<script>
const renderer=new THREE.WebGLRenderer({antialias:true});document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xbacddb);
const camera=new THREE.PerspectiveCamera(45,1,.1,50);camera.position.set(3.5,2.8,6);camera.lookAt(1.3,.5,.5);
scene.add(new THREE.HemisphereLight(0xffffff,0x5c4f3d,1.3));
const fx=[new MiningFX(scene),new MiningFX(scene)],hits=[{x:0,y:0,z:0,n:[0,0,1]},{x:1.6,y:0,z:0,n:[0,0,1]}],ids=[8,3],blocks=[];
const image=new Image();image.onload=()=>{
 [9,3].forEach((tile,i)=>{const c=document.createElement('canvas');c.width=c.height=128;c.getContext('2d').drawImage(image,tile*128,0,128,128,0,0,128,128);
 const m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial({map:new THREE.CanvasTexture(c)}));m.position.set(hits[i].x+.5,.5,.5);scene.add(m);blocks.push(m);});
};image.src='../../assets/texture-packs/natural-v1/stonisle-natural-128.png';
let burst=0,last=0;
document.getElementById('burst').onclick=()=>{fx.forEach((f,i)=>f.break(hits[i],ids[i]));blocks.forEach(b=>b.visible=false);burst=1;};
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();
function frame(t){const dt=last?Math.min(.05,(t-last)/1000):.016;last=t;
 if(burst>0){burst-=dt;if(burst<=0)blocks.forEach(b=>b.visible=true);}
 fx.forEach((f,i)=>{if(burst<=0){const p=+document.getElementById('progress').value;if(p>0)f.damage(hits[i],ids[i],p,dt);else f.reset();}f.update(dt);});
 renderer.render(scene,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
