<!doctype html><html lang="zh"><meta charset="utf-8"><title>Stonisle · 装备穿戴预览</title><style>body{margin:0;background:#201b17;color:#e8d7b3;font:16px system-ui}header{padding:24px 32px 0}h1{font-size:23px;margin:0 0 8px}p{color:#a99b83;margin:0 0 18px;font-size:13px}button{background:#493b2a;color:#eedab3;border:1px solid #88704e;border-radius:6px;padding:9px 16px;margin-right:8px;cursor:pointer}#stage{height:65vh;min-height:360px}canvas{display:block;width:100%;height:100%}.labels{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin:0 9%}.labels small{display:block;color:#a99b83;margin-top:6px;font-size:12px}</style><header><h1>Stonisle · 装备穿戴预览</h1><p>使用游戏中的人物模型与装备材质，比较整套穿戴效果。</p><button id="bodySize">切换儿童体型</button><button id="motion">播放行走</button><button id="turn">查看背面</button></header><div id="stage"></div><div class="labels"><div>草编<small>交错草束 · 绑边</small></div><div>皮革<small>缝线 · 包边 · 搭扣</small></div><div>铁甲<small>板片 · 冷色高光 · 铆钉</small></div><div>合金<small>金色板片 · 深色接缝</small></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="../../src/client/core/core.js"></script><script src="../../src/client/items/metal-finish.js"></script><script src="../../src/client/items/item-art.js"></script><script src="../../src/client/player/avatar.js"></script><script>
const stage=document.getElementById('stage'),r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));stage.appendChild(r.domElement);const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(30,1,.1,50);cam.position.set(0,1.7,-6.4);cam.lookAt(0,1,0);s.add(new THREE.AmbientLight(0xdde7ef,.52));const light=new THREE.DirectionalLight(0xfff2da,.85);light.position.set(-3,5,-5);s.add(light);const rim=new THREE.DirectionalLight(0xb6d8ff,.28);rim.position.set(4,3,2);s.add(rim);let models=[],kid=false,walking=false,back=false;
function rebuild(){for(const m of models){s.remove(m);m.traverse(o=>{if(o.geometry)o.geometry.dispose();});}models=[[121,122,124,123],[40,41,42,125],[43,44,45,126],[127,128,131,129]].map((gear,i)=>{const m=Avatar.build({skin:1,hair:1,shirt:4,pants:0,size:kid?1:0},gear);m.position.x=(1.5-i)*1.25;m.rotation.y=back?Math.PI+.16:.16;s.add(m);return m;});draw();}
function draw(t=0){for(const m of models)Avatar.pose(m,t,walking?.65:0);r.render(s,cam);}
function resize(){r.setSize(stage.clientWidth,stage.clientHeight);cam.aspect=stage.clientWidth/stage.clientHeight;cam.updateProjectionMatrix();draw();}window.addEventListener('resize',resize);document.getElementById('bodySize').onclick=()=>{kid=!kid;rebuild();};document.getElementById('motion').onclick=e=>{walking=!walking;e.target.textContent=walking?'暂停行走':'播放行走';draw();};document.getElementById('turn').onclick=()=>{back=!back;rebuild();};function tick(t){if(walking)draw(t*.005);requestAnimationFrame(tick);}resize();rebuild();requestAnimationFrame(tick);
</script></html>
